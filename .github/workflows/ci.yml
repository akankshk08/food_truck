name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run test:api
      # Known: Next.js 15's build-time postcss advisory needs a Next 16 upgrade; fail only on critical issues.
      - run: npm audit --omit=dev --audit-level=critical
